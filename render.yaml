# Blueprint de Render: define los dos servicios (web + capturas) para que se
# desplieguen juntos con un solo "New Blueprint" al conectar el repositorio.
# Documentación: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: awakelab-marketplace
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /login.php
    envVars:
      # Render rellena esto solo con la dirección interna real del servicio
      # de capturas (host:puerto) — no hace falta adivinarla a mano.
      - key: SCREENSHOT_SERVICE_HOSTPORT
        fromService:
          name: awakelab-marketplace-screenshot
          type: pserv
          property: hostport

  - type: pserv
    name: awakelab-marketplace-screenshot
    runtime: docker
    dockerfilePath: ./screenshot-service/Dockerfile
    dockerContext: ./screenshot-service
    # Los servicios privados no tienen plan gratuito en Render; este es el
    # más pequeño disponible.
    plan: 0.5c-512mb
