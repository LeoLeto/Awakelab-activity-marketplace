# Blueprint de Render: un único servicio web (PHP + capturas juntos en el
# mismo contenedor, ver Dockerfile) — el plan gratuito de Render no permite
# "servicios privados", así que aquí no se usan, a diferencia de local
# (docker-compose.yml sí usa dos contenedores separados).
# Documentación: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: awakelab-marketplace
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /login.php
